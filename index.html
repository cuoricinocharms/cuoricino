<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuoricino - Pulseras Italianas</title>
  <style>
    :root {
      --pink-soft: #fff0f6;
      --pink-light: #ffdeeb;
      --pink-main: #f78da7;
      --pink-dark: #d63384;
      --gradient-brand: linear-gradient(135deg, #f78da7 0%, #d63384 100%);
      --gradient-btn: linear-gradient(135deg, #ff85a2 0%, #e05286 100%);
      --gradient-wsp: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      --gradient-ig: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fafafa;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      width: 100%;
      background: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--pink-main);
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .price-badge {
      background: var(--pink-light);
      color: var(--pink-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1rem;
      border: 1px solid var(--pink-main);
    }

    .container {
      width: 95%;
      max-width: 480px;
    }

    /* VISUALIZADOR ESTILO SATANA (PULSERA ITALIANA REAL) */
    .visualizer-section {
      background: white;
      margin: 20px 0;
      padding: 25px 10px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
    }

    /* Riel/hilo de fondo donde encastran */
    .bracelet-rail {
      position: relative;
      background: #ffffff;
      padding: 20px 5px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .bracelet-rail::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #b0b0b0;
      z-index: 1;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .bracelet-chain {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      z-index: 2;
      padding: 0 10px;
    }

    .empty-msg {
      color: #999;
      font-size: 0.88rem;
      font-style: italic;
      z-index: 2;
      background: white;
      padding: 4px 12px;
      border-radius: 10px;
    }

    /* Cada Eslabón de Acero (Charm Individual) */
    .charm-module {
      width: 70px;
      height: 60px;
      background: linear-gradient(180deg, #f0f0f0 0%, #d8d8d8 50%, #afafaf 100%);
      border: 2px solid #888;
      border-radius: 6px;
      padding: 4px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 2px 3px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .charm-module img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #777;
    }

    /* Catálogo Grid */
    .section-title {
      font-size: 1.1rem;
      color: #333;
      margin: 15px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      background-color: var(--pink-soft);
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 4px;
    }

    .card-price {
      font-size: 0.85rem;
      color: var(--pink-dark);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .btn-add {
      background: var(--gradient-btn);
      color: white;
      border: none;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    /* Resumen abajo */
    .cart-summary {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin: 20px 0 15px 0;
      border: 1px solid var(--pink-light);
    }

    .cart-summary-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .cart-list {
      list-style: none;
      font-size: 0.85rem;
      color: #555;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #f0f0f0;
    }

    /* Botones de Acción */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 15px 0 30px 0;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn-whatsapp {
      background: var(--gradient-wsp);
    }

    .btn-instagram {
      background: var(--gradient-ig);
    }

    /* Barra inferior fija */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .btn-clear {
      background-color: #f1f2f6;
      color: #666;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit-main {
      background: var(--gradient-wsp);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-container">
      <img src="logo" alt="Cuoricino" class="logo-img" onerror="this.style.display='none'">
      <span class="brand-name">cuoricino</span>
    </div>
    <div class="price-badge" id="totalPrice">$0</div>
  </header>

  <div class="container">

    <!-- Visualizador Tipo Italian Bracelet -->
    <section class="visualizer-section">
      <div class="bracelet-rail">
        <div class="bracelet-chain" id="braceletDisplay">
          <span class="empty-msg">Tocá en "Agregar" para armar tu pulsera</span>
        </div>
      </div>
    </section>

    <!-- Catálogo de Dijes -->
    <section class="catalog-section">
      <h2 class="section-title">Catálogo</h2>
      <div class="catalog-grid">

        <div class="card">
          <img src="atardecer" alt="Atardecer" class="card-img">
          <div class="card-title">Charm Atardecer</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Atardecer', 6000, 'atardecer')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="atardcer rosa" alt="Atardecer Rosa" class="card-img">
          <div class="card-title">Charm Atardecer Rosa</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Atardecer Rosa', 6000, 'atardcer rosa')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="camara" alt="Cámara" class="card-img">
          <div class="card-title">Charm Cámara</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Cámara', 6000, 'camara')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="ibiza" alt="Ibiza" class="card-img">
          <div class="card-title">Charm Ibiza</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Ibiza', 6000, 'ibiza')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="italia" alt="Italia" class="card-img">
          <div class="card-title">Charm Italia</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Italia', 6000, 'italia')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="mar" alt="Mar" class="card-img">
          <div class="card-title">Charm Mar</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Mar', 6000, 'mar')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="musica" alt="Música" class="card-img">
          <div class="card-title">Charm Música</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Música', 6000, 'musica')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="ola" alt="Ola" class="card-img">
          <div class="card-title">Charm Ola</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Ola', 6000, 'ola')">+ Agregar</button>
        </div>

        <div class="card">
          <img src="spiderman" alt="Spiderman" class="card-img">
          <div class="card-title">Charm Spiderman</div>
          <div class="card-price">$6.000</div>
          <button class="btn-add" onclick="addItem('Charm Spiderman', 6000, 'spiderman')">+ Agregar</button>
        </div>

      </div>
    </section>

    <!-- Resumen abajo -->
    <div class="cart-summary" id="cartSummary" style="display: none;">
      <div class="cart-summary-title">
        <span>Resumen de tu pulsera</span>
        <span id="itemCount" style="font-weight: normal; color: #777;">0 dijes</span>
      </div>
      <ul class="cart-list" id="cartList"></ul>
    </div>

    <!-- Botones de Acción -->
    <div class="action-buttons">
      <button class="btn-action btn-whatsapp" onclick="sendWhatsApp()">
        💬 Pedir por WhatsApp
      </button>
      <button class="btn-action btn-instagram" onclick="openInstagram()">
        📸 Ir al Instagram @cuoricino_charms
      </button>
    </div>

  </div>

  <!-- Barra inferior fija -->
  <div class="bottom-bar">
    <button class="btn-clear" onclick="clearItems()">Vaciar</button>
    <button class="btn-submit-main" onclick="sendWhatsApp()">Enviar Pedido ($<span id="bottomTotal">0</span>)</button>
  </div>

  <script>
    let total = 0;
    let selectedItems = [];

    function addItem(name, price, imgSrc) {
      total += price;
      selectedItems.push({ name: name, price: price, imgSrc: imgSrc });
      updateUI();
    }

    function clearItems() {
      total = 0;
      selectedItems = [];
      updateUI();
    }

    function updateUI() {
      const formattedTotal = total.toLocaleString('es-AR');
      document.getElementById('totalPrice').innerText = '$' + formattedTotal;
      document.getElementById('bottomTotal').innerText = formattedTotal;

      const display = document.getElementById('braceletDisplay');
      if (selectedItems.length === 0) {
        display.innerHTML = '<span class="empty-msg">Tocá en "Agregar" para armar tu pulsera</span>';
        document.getElementById('cartSummary').style.display = 'none';
      } else {
        display.innerHTML = '';
        selectedItems.forEach(item => {
          const moduleDiv = document.createElement('div');
          moduleDiv.className = 'charm-module';
          
          const img = document.createElement('img');
          img.src = item.imgSrc;
          img.alt = item.name;

          moduleDiv.appendChild(img);
          display.appendChild(moduleDiv);
        });

        document.getElementById('cartSummary').style.display = 'block';
        document.getElementById('itemCount').innerText = selectedItems.length + ' dije(s)';
        
        const counts = {};
        selectedItems.forEach(item => {
          counts[item.name] = (counts[item.name] || 0) + 1;
        });

        const cartList = document.getElementById('cartList');
        cartList.innerHTML = '';
        for (const [name, qty] of Object.entries(counts)) {
          const li = document.createElement('li');
          li.className = 'cart-item';
          li.innerHTML = `<span><strong>${qty}x</strong> ${name}</span><span>$${(qty * 6000).toLocaleString('es-AR')}</span>`;
          cartList.appendChild(li);
        }
      }
    }

    function sendWhatsApp() {
      if (selectedItems.length === 0) {
        alert('Por favor elegí al menos 1 dije para armar tu pulsera.');
        return;
      }

      const counts = {};
      selectedItems.forEach(item => {
        counts[item.name] = (counts[item.name] || 0) + 1;
      });

      let itemsText = '';
      for (const [itemName, qty] of Object.entries(counts)) {
        itemsText += `${qty}x ${itemName}, `;
      }
      itemsText = itemsText.slice(0, -2);

      const totalQty = selectedItems.length;
      const formattedTotal = total.toLocaleString('es-AR');

      const message = `¡Holaa! 💗 Quiero encargar mi pulsera cuoricino ✨\n\n` +
        `♡ Nombre y apellido:\n` +
        `♡ Si sos de la escuela, indicá tu año y división:\n` +
        `♡ Producto que quiero: Pulsera Italiana\n` +
        `♡ Charms que elegí: ${itemsText}\n` +
        `♡ Cantidad: ${totalQty} dije(s)\n` +
        `♡ Total: $${formattedTotal}\n\n` +
        `vi toda la información en la página, así que quería consultar por la disponibilidad y cómo puedo realizar la compra 💌\n` +
        `¡graciasss! 🫶🏻`;

      const phone = "5493412651141";
      const wspUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(wspUrl, '_blank');
    }

    function openInstagram() {
      window.open("https://instagram.com/cuoricino_charms", '_blank');
    }
  </script>
</body>
</html>
